<svg width="48" height="48" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1024" y2="1024">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <radialGradient id="top-fill" cx="0.4" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#B0D4EC"/>
      <stop offset="100%" stop-color="#6FA8D6"/>
    </radialGradient>
    <radialGradient id="bottom-fill" cx="0.4" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#F5E6A3"/>
      <stop offset="100%" stop-color="#D4B94E"/>
    </radialGradient>
    <linearGradient id="slash-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#908A9A"/>
      <stop offset="100%" stop-color="#6E6878"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg-gradient)"/>

  <!-- % symbol, slightly rotated -->
  <g transform="translate(512, 512) rotate(-11) translate(-512, -512)">
    <!-- Top-left circle (blue) -->
    <g transform="translate(245, 200)">
      <circle cx="135" cy="135" r="135" fill="url(#top-fill)"/>
      <circle cx="135" cy="135" r="55" fill="url(#bg-gradient)"/>
    </g>
    <!-- Bottom-right circle (gold) -->
    <g transform="translate(505, 480)">
      <circle cx="160" cy="160" r="160" fill="url(#bottom-fill)"/>
      <circle cx="160" cy="160" r="65" fill="url(#bg-gradient)"/>
    </g>
    <!-- Diagonal slash (on top) -->
    <rect x="450" y="60" width="85" height="860" rx="42" fill="url(#slash-fill)" transform="rotate(44, 512, 512)"/>
  </g>
</svg>
