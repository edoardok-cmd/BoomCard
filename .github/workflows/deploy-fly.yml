name: Deploy Backend (Fly.io)

# Production branch is `master` (NOT `main`). The legacy cd.yml / ci-cd.yml
# deploy jobs are gated on a `main` branch that does not exist, so they never
# fire — which is why prod historically drifted "stale" behind master. This
# workflow closes that gap for the backend: every push to master that touches
# backend-api (or a manual run) deploys the Fly app `boomcard-api`.
#
# Requires a repo secret FLY_API_TOKEN. Generate a deploy-scoped token with:
#   fly tokens create deploy -a boomcard-api
# then add it under Settings → Secrets and variables → Actions → FLY_API_TOKEN.
#
# ---------------------------------------------------------------------------
# BC-QA-051 (2026-08-20): THIS WORKFLOW USED TO LIE.
#
# It was a single `flyctl deploy --remote-only --config fly.toml` step. Because
# fly.toml defined NO health checks, `flyctl deploy` reported SUCCESS as soon as
# machines were created — even though the process inside them exited 1
# immediately (a failed Prisma migration, P3009, in the start command) and Fly
# crash-looped them to the max restart count. Six consecutive runs of this
# workflow were green while boomcard-api served nothing at all:
#   2026-08-10 11:42, 2026-08-10 14:55, 2026-08-19 21:29,
#   2026-08-19 22:41, 2026-08-20 00:34, 2026-08-20 10:56.
# The API was down for ~10 days and CI never once said so.
#
# Three independent gates now stand between a bad build and a green check:
#   1. `flyctl config validate --strict` BEFORE deploying — a malformed or
#      unrecognised fly.toml fails here instead of at deploy time.
#   2. `flyctl deploy` itself now gates on the health check added to fly.toml
#      ([[http_service.checks]] on /health) and on `[deploy] release_command`.
#      A migration failure aborts the release with the previous version still
#      serving; a process that starts and dies fails the health check and
#      therefore fails the deploy.
#   3. A post-deploy assertion against the PUBLIC health URL. This is not
#      redundant with (2): Fly's check runs INSIDE the machine against
#      127.0.0.1:3001, so it cannot see the edge — proxy routing,
#      force_https/TLS, [http_service] service wiring, or a certificate
#      problem. It also exercises `/api/health`, the exact base path that
#      boomcard.bg's frontend calls, rather than the internal `/health`. The
#      user-visible symptom of this outage was "boomcard-api.fly.dev/api/health
#      times out", so that is precisely the thing CI should assert.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [master]
    paths:
      - 'backend-api/**'
      - '.github/workflows/deploy-fly.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-fly-boomcard-api
  cancel-in-progress: false

env:
  FLY_APP: boomcard-api
  HEALTH_URL: https://boomcard-api.fly.dev/api/health

jobs:
  deploy:
    name: flyctl deploy boomcard-api
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Gate 1 — catch a broken config before it can touch production.
      - name: Validate fly.toml
        working-directory: backend-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl config validate --strict --config fly.toml --app "$FLY_APP"

      # Gate 2 — the deploy itself. With [[http_service.checks]] defined in
      # fly.toml, flyctl now waits for machines to report HEALTHY and fails the
      # step if they do not within --wait-timeout. `[deploy] release_command`
      # runs the migration first; if it exits non-zero the deploy aborts here
      # and the previously deployed version keeps serving traffic.
      #
      # --wait-timeout 10m: covers release_command (migration) + rolling
      # replacement of both app machines, each of which cannot report healthy
      # for at least its 30s grace_period.
      - name: Deploy to Fly.io
        working-directory: backend-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --remote-only \
            --config fly.toml \
            --app "$FLY_APP" \
            --wait-timeout 10m

      # Gate 3 — assert the public endpoint the frontend actually uses.
      # Retries because a rolling deploy can briefly race the edge; fails hard
      # if the API is not answering 200 within ~2.5 minutes.
      - name: Assert public API health
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          echo "Asserting 200 from $HEALTH_URL"
          attempts=30
          for i in $(seq 1 "$attempts"); do
            # NB: on a connection failure curl itself prints "000" AND exits
            # non-zero, so `$(curl ...) || echo 000` would yield "000000".
            # Assign, then overwrite on non-zero exit.
            code=$(curl -sS -o /tmp/health.out -w '%{http_code}' \
                     --max-time 10 "$HEALTH_URL") || code="000"
            if [ "$code" = "200" ]; then
              echo "attempt $i/$attempts: HTTP $code"
              cat /tmp/health.out; echo
              echo "::notice::boomcard-api is serving $HEALTH_URL (HTTP 200)"
              exit 0
            fi
            echo "attempt $i/$attempts: HTTP $code (retrying in 5s)"
            sleep 5
          done
          echo "::error::Deploy reported success but $HEALTH_URL never returned 200."
          echo "----- last response body -----"
          cat /tmp/health.out || true
          echo
          echo "----- flyctl status -----"
          flyctl status --app "$FLY_APP" || true
          echo "----- recent logs -----"
          flyctl logs --app "$FLY_APP" --no-tail || true
          exit 1

      # Diagnostics on ANY failure above. Without this, a failed deploy is a red
      # X with no explanation and the next move is to go log into Fly by hand.
      - name: Dump Fly diagnostics on failure
        if: failure()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "----- flyctl status -----"
          flyctl status --app "$FLY_APP" || true
          echo "----- flyctl releases -----"
          flyctl releases --app "$FLY_APP" || true
          echo "----- recent logs -----"
          flyctl logs --app "$FLY_APP" --no-tail || true
          echo
          echo "If the release command failed, the PREVIOUS version is still"
          echo "serving — production was not replaced by a broken release."
          echo "Check migration state with:"
          echo "  flyctl ssh console -a $FLY_APP -C 'npm run db:migrate:status'"
