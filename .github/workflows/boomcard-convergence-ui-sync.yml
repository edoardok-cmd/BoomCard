# boomcard-convergence-ui-sync.yml
#
# PURPOSE: Gate ensuring the BoomCard Convergence Monitor UI
# (ai-automation-platform, http://localhost:5124/boomcard-convergence)
# is never silently out of date when BoomCard surface artifacts change.
#
# Triggers on changes to sweep files, invariant matrices, or route manifests.
# Checks:
#   1. boomcard-convergence-plan.md exists with §6 prompts
#   2. Sweep files referenced in the plan exist on disk
#   3. Manifest JSON files are valid (if present)
#   4. Invariant matrices contain INV- rows
#
# AAP-SIDE PARSE CHECK: scripts/check-boomcard-convergence.mjs in ai-automation-platform/
# imports the same reader module as pages/api/boomcard-convergence/data.ts and exits
# non-zero if any existing ledger/manifest fails to parse or yields 0 rows.
# Run locally: cd ai-automation-platform && npm run check:boomcard-convergence
#
# Reference: ai-automation-platform/pages/boomcard-convergence.tsx (the UI)
#            ai-automation-platform/pages/api/boomcard-convergence/data.ts (the data API)
#            ai-automation-platform/src/server/convergence/boomcard-readers.ts (shared parser)

name: BoomCard Convergence UI Sync Check

on:
  push:
    branches: [main, master]
    paths:
      # Sweep test files
      - 'backend-api/tests/integration/**sweep*.test.ts'
      - 'backend-api/tests/integration/**sweep*.test.js'
      # Requirement documents and invariant matrices.
      # Widened from three named matrices to the whole directory (BC-QA-031):
      # spec-corpus-dual-currency-sweep polices docs/specs/0*.md — the numbered
      # requirement set — and an edit there previously reached NO workflow at all,
      # which is how 08-user-spec-extracted.md kept a live dual-display
      # requirement through seven audit rounds.
      - 'docs/specs/**'
      # Route ownership manifests
      - 'backend-api/tests/app-route-ownership-manifest.json'
      - 'backend-api/tests/admin-endpoint-manifest.json'

  pull_request:
    branches: [main, master]
    paths:
      - 'backend-api/tests/integration/**sweep*.test.ts'
      - 'backend-api/tests/integration/**sweep*.test.js'
      # Requirement documents and invariant matrices (see the push trigger above).
      - 'docs/specs/**'
      - 'backend-api/tests/app-route-ownership-manifest.json'
      - 'backend-api/tests/admin-endpoint-manifest.json'

jobs:
  boomcard-convergence-ui-sync:
    name: BoomCard Convergence UI artifact sync check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Check 1: boomcard-convergence-plan.md exists with §6 prompts section
      # -----------------------------------------------------------------------
      - name: Check boomcard-convergence-plan.md exists with §6 prompts
        run: |
          PLAN="docs/specs/boomcard-convergence-plan.md"

          if [ ! -f "$PLAN" ]; then
            echo "FAIL: docs/specs/boomcard-convergence-plan.md does not exist."
            echo ""
            echo "This file must be present and contain a '§6 Re-audit prompts' section."
            echo "The BoomCard Convergence Monitor UI (served at :5124/boomcard-convergence)"
            echo "reads its static prompts from this file."
            echo ""
            echo "Create the file with at least §1 (Overview) and §6 (Re-audit prompts)."
            exit 1
          fi

          if grep -q "§6" "$PLAN"; then
            echo "OK: docs/specs/boomcard-convergence-plan.md exists and contains §6 prompts."
            grep -q "BC-ADMIN-SPEC-REAUDIT" "$PLAN" || { echo "ERROR: boomcard-convergence-plan.md §6 missing BC-ADMIN-SPEC-REAUDIT prompt"; exit 1; }
            grep -q "BC-PARTNER-SPEC-REAUDIT" "$PLAN" || { echo "ERROR: boomcard-convergence-plan.md §6 missing BC-PARTNER-SPEC-REAUDIT prompt"; exit 1; }
            grep -q "BC-USER-SPEC-REAUDIT" "$PLAN" || { echo "ERROR: boomcard-convergence-plan.md §6 missing BC-USER-SPEC-REAUDIT prompt"; exit 1; }
          else
            echo "FAIL: docs/specs/boomcard-convergence-plan.md exists but is missing §6 (Re-audit prompts)."
            echo ""
            echo "The §6 section must contain copy-paste-ready prompts for:"
            echo "  - BC-ADMIN-SPEC-REAUDIT Round 1 (bootstrap)"
            echo "  - BC-ADMIN-SPEC-REAUDIT Round N+ (continuation)"
            echo "  - BC-PARTNER-SPEC-REAUDIT Round 1 (bootstrap)"
            echo "  - BC-PARTNER-SPEC-REAUDIT Round N+ (continuation)"
            echo "  - BC-USER-SPEC-REAUDIT Round 1 (bootstrap)"
            exit 1
          fi

      # -----------------------------------------------------------------------
      # Check 2: Referenced sweep files exist on disk
      # -----------------------------------------------------------------------
      - name: Check expected sweep files exist
        run: |
          INTEGRATION="backend-api/tests/integration"
          MISSING=()

          # BC-QA-031: the dual-currency (BGN+EUR) display feature was retired with
          # Bulgaria's transition window, taking its CUR-class sweeps with it.
          #   - admin-currency-leak-sweep.test.ts   — deleted, no replacement
          #     (the admin surface has no dual-currency envelope left to police)
          #   - partner-currency-leak-sweep.test.ts — RENAMED to
          #     partner-internal-field-leak-sweep.test.ts; its non-currency
          #     internal-field invariant survives there
          #   - user-currency-leak-sweep.test.ts    — its non-currency invariants
          #     were extracted to user-internal-field-leak-sweep.test.ts
          # The renamed replacements are listed below so this check guards the
          # suites that actually exist rather than the retired ones.

          # Admin sweeps
          for f in \
            "admin-uuid-500-sweep.test.ts"; do
            if [ ! -f "$INTEGRATION/$f" ]; then
              MISSING+=("$INTEGRATION/$f")
            fi
          done

          # Partner sweeps
          for f in \
            "partner-cross-scope-sweep.test.ts" \
            "partner-internal-field-leak-sweep.test.ts" \
            "partner-uuid-500-sweep.test.ts"; do
            if [ ! -f "$INTEGRATION/$f" ]; then
              MISSING+=("$INTEGRATION/$f")
            fi
          done

          # User / subscriber sweeps (BC-QA-031 replacements)
          for f in \
            "user-internal-field-leak-sweep.test.ts" \
            "subscriber-internal-field-introspect-sweep.test.ts" \
            "spec-corpus-dual-currency-sweep.test.ts"; do
            if [ ! -f "$INTEGRATION/$f" ]; then
              MISSING+=("$INTEGRATION/$f")
            fi
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "WARN: The following sweep files referenced in the convergence plan are missing:"
            for f in "${MISSING[@]}"; do
              echo "  - $f"
            done
            echo ""
            echo "The BoomCard Convergence Monitor UI will show these sweeps as 'missing'."
            echo "This is expected for bootstraps-in-progress. Not a hard fail."
            echo "Add sweep files to backend-api/tests/integration/ to make badges go green."
          else
            echo "OK: All expected sweep files are present."
          fi

      # -----------------------------------------------------------------------
      # Check 3: Manifests have valid JSON if they exist
      # -----------------------------------------------------------------------
      - name: Validate manifest JSON (if present)
        run: |
          for manifest in \
            "backend-api/tests/app-route-ownership-manifest.json" \
            "backend-api/tests/admin-endpoint-manifest.json"; do

            if [ -f "$manifest" ]; then
              if python3 -m json.tool "$manifest" > /dev/null 2>&1; then
                echo "OK: $manifest is valid JSON."
              else
                echo "FAIL: $manifest exists but is not valid JSON."
                echo "The BoomCard Convergence Monitor UI reads this file directly."
                echo "Fix the JSON before merging."
                exit 1
              fi
            else
              echo "SKIP: $manifest not yet built — bootstrap pending."
            fi
          done

      # -----------------------------------------------------------------------
      # Check 4: Invariant matrices reference the scope IDs the UI expects
      # -----------------------------------------------------------------------
      - name: Check invariant matrices contain expected scope markers
        run: |
          ADMIN_MATRIX="docs/specs/admin-invariant-matrix.md"
          PARTNER_MATRIX="docs/specs/partner-spec-invariant-matrix.md"

          if [ -f "$ADMIN_MATRIX" ]; then
            if grep -q "INV-" "$ADMIN_MATRIX"; then
              echo "OK: $ADMIN_MATRIX contains INV- invariant rows."
            else
              echo "WARN: $ADMIN_MATRIX exists but contains no INV- invariant rows."
            fi
          else
            echo "SKIP: $ADMIN_MATRIX not found."
          fi

          if [ -f "$PARTNER_MATRIX" ]; then
            if grep -q "INV-" "$PARTNER_MATRIX"; then
              echo "OK: $PARTNER_MATRIX contains INV- invariant rows."
            else
              echo "WARN: $PARTNER_MATRIX exists but contains no INV- invariant rows."
            fi
          else
            echo "SKIP: $PARTNER_MATRIX not found."
          fi

      # -----------------------------------------------------------------------
      # Push-range surface file detection
      # Reports which BoomCard surface files changed across the full push range
      # (github.event.before..HEAD) so multi-commit pushes don't miss earlier
      # commits. Falls back to HEAD~1 for new-branch pushes (all-zeros before).
      # -----------------------------------------------------------------------
      - name: Detect changed surface files (full push range)
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_REF="${GITHUB_BASE_REF:-main}"
            git fetch origin "$BASE_REF" --depth=50 2>/dev/null || true
            RANGE="origin/${BASE_REF}...HEAD"
          else
            BEFORE="${GITHUB_EVENT_BEFORE:-}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="HEAD~1..HEAD"
            else
              RANGE="${BEFORE}..HEAD"
            fi
          fi
          CHANGED=$(git diff --name-only "$RANGE" 2>/dev/null || echo "")
          if [ -z "$CHANGED" ]; then
            echo "No files detected in range $RANGE."
          else
            echo "Files changed in push range ($RANGE):"
            echo "$CHANGED" | grep -E '\.(ts|js|md|json)$' || true
          fi

      # -----------------------------------------------------------------------
      # AAP-side parse check
      # Verifies that the ai-automation-platform reader module can parse all
      # existing BoomCard convergence artifacts (ledgers, manifests, roll-ups).
      # Runs scripts/check-boomcard-convergence.mjs, which imports the same
      # reader used by pages/api/boomcard-convergence/data.ts.
      #
      # To run in CI with AAP repo access:
      #   - Checkout ai-automation-platform alongside this repo
      #   - Run: cd <aap-path> && BOOMCARD_REPO=$GITHUB_WORKSPACE node scripts/check-boomcard-convergence.mjs
      #
      # Run locally: cd /path/to/ai-automation-platform && npm run check:boomcard-convergence
      # -----------------------------------------------------------------------
      - name: AAP-side parse check (log local equivalent)
        run: |
          echo "============================================================"
          echo "AAP-side BoomCard convergence parse check"
          echo "============================================================"
          echo ""
          echo "This check runs the reader module that the Convergence Monitor UI"
          echo "uses (pages/api/boomcard-convergence/data.ts) against real artifacts:"
          echo ""
          echo "  cd ai-automation-platform"
          echo "  BOOMCARD_REPO=<path-to-boomcard> npm run check:boomcard-convergence"
          echo ""
          echo "Exit 0  = all ledgers/manifests/roll-ups parsed cleanly"
          echo "Exit 1  = any artifact failed to parse or yielded 0 rows/routes"
          echo ""
          echo "Shared module: src/server/convergence/boomcard-readers.ts"
          echo "Gate script:   scripts/check-boomcard-convergence.mjs"
          echo "npm script:    npm run check:boomcard-convergence"

      # -----------------------------------------------------------------------
      # Summary
      # -----------------------------------------------------------------------
      - name: Sync gate summary
        if: always()
        run: |
          echo "============================================================"
          echo "BoomCard Convergence UI Sync Gate"
          echo "UI served at: http://localhost:5124/boomcard-convergence"
          echo "Data API: /api/boomcard-convergence/data"
          echo "============================================================"
          echo ""
          echo "This gate runs 4 existence/consistency checks:"
          echo "  1. boomcard-convergence-plan.md exists with §6 prompts"
          echo "  2. Sweep files exist in backend-api/tests/integration/ (warn, not fail)"
          echo "  3. Manifest files are valid JSON (if present)"
          echo "  4. Invariant matrices contain INV- rows (warn)"
          echo ""
          echo "PLUS: AAP-side parse check (check:boomcard-convergence) that asserts"
          echo "  parsability of all existing ledgers/manifests/roll-ups using the"
          echo "  same reader module as the Convergence Monitor UI."
          echo "  Run: cd ai-automation-platform && npm run check:boomcard-convergence"
          echo ""
          echo "Push-range detection uses github.event.before..HEAD (not HEAD~1) to"
          echo "  catch surface file changes across multi-commit pushes."
          echo ""
          echo "Coverage ledgers (.claude/reviews/*-coverage-ledger.md) live"
          echo "in the Agent X harness workspace — the finish-task.py + effectiveStatusFor"
          echo "gates in Agent X already enforce them. This CI gate covers BoomCard-repo"
          echo "artifacts only: sweep files, matrices, manifests, and the convergence plan."
          echo "============================================================"
