name: Deploy Frontend (Vercel)

# Production branch is `master` (NOT `main`). The legacy cd.yml / ci-cd.yml
# Vercel deploy jobs are gated on a `main` branch that does not exist, so they
# never fire — which is why boomcard.bg historically drifted "stale" behind
# master (committed UI fixes were pushed but never shipped). This workflow
# closes that gap for the frontend: every push to master that touches the
# partner-dashboard app (or a manual run) deploys the root Vercel project that
# serves boomcard.bg.
#
# The root vercel.json is the source of truth — it builds the partner-dashboard
# workspace (`npm run build --workspace=partner-dashboard` -> partner-dashboard/dist).
# We deploy from the repo root via the Vercel CLI so the build matches the
# proven manual `vercel --prod` path, not the stale ./partner-dashboard variant.
#
# Requires repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# (the same secrets the legacy ci-cd.yml job already references).
#
# OAuth (VITE_GOOGLE_CLIENT_ID, VITE_FACEBOOK_APP_ID): Google/Facebook login
# buttons are UI-present but wrapped in a "Coming soon" overlay and are NOT
# functionally live. Credentials must NOT be committed here. Add them to the
# Vercel dashboard (Environment Variables → Production) when OAuth is activated.

on:
  push:
    branches: [master]
    paths:
      - 'partner-dashboard/**'
      - 'vercel.json'
      - '.github/workflows/deploy-vercel.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-vercel-boomcard-bg
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: vercel deploy --prod (boomcard.bg)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings (production)
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build (production)
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Verify deployment health
        run: |
          set -e
          echo "Checking https://boomcard.bg/ status..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://boomcard.bg/)
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "❌ POST-DEPLOY HEALTH CHECK FAILED: boomcard.bg returned $HTTP_CODE"
            echo "To rollback: vercel rollback --token ${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }}"
            exit 1
          fi
          echo "✓ Health check passed: boomcard.bg returned 200 OK"
