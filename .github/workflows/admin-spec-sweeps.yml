# Admin Spec Coverage Sweeps — REQUIRED merge gate (enforcement, not advisory).
#
# Why this exists: the BoomCard admin spec was re-audited 6 times and each round
# surfaced a different, unrelated batch of defects — classic low-recall *sampling*.
# The fix was to convert the recurring finding-classes (raw-BGN currency leaks past
# the dual-currency window gate; malformed-:id 500s) into EXHAUSTIVE, route-
# introspecting jest sweeps that enumerate the live Express route table, so every
# admin endpoint — including ones added later — is checked automatically.
#
# Those sweeps only enforce anything if a red sweep blocks the build. The existing
# `qa-cycle.yml` runs backend tests with `continue-on-error: true` + `--passWithNoTests`,
# so a failing test never gates a merge. This workflow is the deliberate opposite:
# it runs ONLY the two deterministic admin-spec sweeps, with NO continue-on-error,
# so a currency leak or input-boundary 500 anywhere on the admin surface fails CI.
# Mark this check "Required" in the branch protection rules to make it un-skippable.
name: Admin Spec Coverage Sweeps

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  admin-spec-sweeps:
    name: Deterministic spec gates (uuid-500, endpoint coverage, route ownership, docs corpus)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boomcard_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boomcard_test
      JWT_SECRET: test-jwt-secret
      JWT_REFRESH_SECRET: test-jwt-refresh-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend-api/package-lock.json

      - name: Install dependencies
        working-directory: backend-api
        run: npm ci

      - name: Apply migrations to test DB
        working-directory: backend-api
        run: npx prisma migrate deploy

      # No continue-on-error: a red sweep MUST fail the build. --runInBand keeps the
      # route-introspection deterministic. Add new <class>-sweep.test.ts files here as
      # more recurring finding-classes are converted to exhaustive sweeps.
      #
      # admin-endpoint-coverage enforces coverage BREADTH: a new admin route that
      # isn't accounted for in tests/admin-endpoint-manifest.json fails the build,
      # so no endpoint can be added without being classified/reviewed. The sweep
      # below enforces coverage DEPTH for the INPUT class.
      #
      # BC-QA-031: admin-currency-leak-sweep.test.ts was removed from this list
      # because the CUR (dual-currency display) class it enforced was retired with
      # the feature — the BGN→EUR transition window closed, so there is no
      # `display:{bgn,eur}` envelope left to police on the admin surface. The file
      # is deleted, not renamed; there is no admin-side replacement to add here.
      #
      # spec-corpus-dual-currency-sweep is not an admin-route sweep. It is here
      # because this is the ONLY workflow in the repo that invokes jest without
      # `continue-on-error`, and it carries no `paths:` filter, so it runs on every
      # push and PR to a protected branch — which is what a standing guard needs.
      # It is deterministic, touches no database and adds a few seconds. The job
      # name above was widened to say so rather than leaving the addition to look
      # like an admin sweep.
      #
      # Deliberately NO --passWithNoTests: if every pattern below is ever deleted,
      # jest exits 1 on "0 matches" and the gate fails loudly instead of silently
      # passing an empty run. (Note that jest exits 0 when SOME patterns match, so a
      # single stale path here would have degraded this gate silently rather than
      # breaking the build — which is exactly why the stale path is removed rather
      # than left in place.)
      - name: Run admin-spec coverage sweeps + endpoint-coverage gate
        working-directory: backend-api
        run: >-
          npx jest
          tests/integration/admin-uuid-500-sweep.test.ts
          tests/integration/admin-endpoint-coverage.test.ts
          tests/integration/app-route-ownership.test.ts
          tests/integration/spec-corpus-dual-currency-sweep.test.ts
          --runInBand --ci
