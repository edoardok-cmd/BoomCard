# Admin Spec Coverage Sweeps — REQUIRED merge gate (enforcement, not advisory).
#
# Why this exists: the BoomCard admin spec was re-audited 6 times and each round
# surfaced a different, unrelated batch of defects — classic low-recall *sampling*.
# The fix was to convert the recurring finding-classes (raw-BGN currency leaks past
# the dual-currency window gate; malformed-:id 500s) into EXHAUSTIVE, route-
# introspecting jest sweeps that enumerate the live Express route table, so every
# admin endpoint — including ones added later — is checked automatically.
#
# Those sweeps only enforce anything if a red sweep blocks the build. The existing
# `qa-cycle.yml` runs backend tests with `continue-on-error: true` + `--passWithNoTests`,
# so a failing test never gates a merge. This workflow is the deliberate opposite:
# it runs ONLY the two deterministic admin-spec sweeps, with NO continue-on-error,
# so a currency leak or input-boundary 500 anywhere on the admin surface fails CI.
# Mark this check "Required" in the branch protection rules to make it un-skippable.
name: Admin Spec Coverage Sweeps

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  admin-spec-sweeps:
    # BC-QA-051 added two more gates to the jest step below (the (phone, role)
    # partial-unique pin and its teeth-proof) and DELIBERATELY did not extend this
    # `name:` to enumerate them, breaking with the precedent set when
    # spec-corpus-dual-currency-sweep was added. Reason: this job's `name:` IS the
    # status-check name that branch protection matches on, and the header above asks
    # for it to be marked Required. Renaming it silently detaches the required check
    # until someone re-points branch protection by hand — i.e. CI keeps reporting
    # green while the gate no longer gates anything. That is the same failure mode
    # BC-QA-051 exists to repair (nine green CD runs over a dead production API), so
    # accepting a slightly stale enumeration here is the cheaper error. If the name
    # is ever widened, update the branch protection rule in the same change.
    name: Deterministic spec gates (uuid-500, endpoint coverage, route ownership, docs corpus)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boomcard_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boomcard_test
      JWT_SECRET: test-jwt-secret
      JWT_REFRESH_SECRET: test-jwt-refresh-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend-api/package-lock.json

      - name: Install dependencies
        working-directory: backend-api
        run: npm ci

      - name: Apply migrations to test DB
        working-directory: backend-api
        run: npx prisma migrate deploy

      # No continue-on-error: a red sweep MUST fail the build. --runInBand keeps the
      # route-introspection deterministic. Add new <class>-sweep.test.ts files here as
      # more recurring finding-classes are converted to exhaustive sweeps.
      #
      # admin-endpoint-coverage enforces coverage BREADTH: a new admin route that
      # isn't accounted for in tests/admin-endpoint-manifest.json fails the build,
      # so no endpoint can be added without being classified/reviewed. The sweep
      # below enforces coverage DEPTH for the INPUT class.
      #
      # BC-QA-031: admin-currency-leak-sweep.test.ts was removed from this list
      # because the CUR (dual-currency display) class it enforced was retired with
      # the feature — the BGN→EUR transition window closed, so there is no
      # `display:{bgn,eur}` envelope left to police on the admin surface. The file
      # is deleted, not renamed; there is no admin-side replacement to add here.
      #
      # spec-corpus-dual-currency-sweep is not an admin-route sweep. It is here
      # because this is the ONLY workflow in the repo that invokes jest without
      # `continue-on-error`, and it carries no `paths:` filter, so it runs on every
      # push and PR to a protected branch — which is what a standing guard needs.
      # Its own assertions are deterministic and read only files on disk — it makes
      # no query of its own. It is NOT database-free, though: every jest suite in
      # this repo goes through tests/setup.ts, which runs `npx prisma migrate deploy`
      # in global setup, so pointing DATABASE_URL at a closed port fails this suite
      # like any other. That is why it belongs in THIS job, which already provisions
      # postgres, rather than in a lighter standalone workflow that would have to
      # provision one anyway. The job name above was widened to say so rather than
      # leaving the addition to look like an admin sweep.
      #
      # BC-QA-051: user-phone-role-partial-unique[.teeth] are likewise not admin-route
      # sweeps, and are here for the same reason as spec-corpus-dual-currency-sweep —
      # this is the only jest invocation in the repo that can fail a build, and it
      # already provisions postgres and deploys migrations, which is exactly what
      # these two need.
      #
      # They pin the ONE property that CI is structurally blind to. `(phone, role)`
      # uniqueness on "User" must stay PARTIAL (`WHERE btrim("phone") <> ''`): "phone"
      # is NOT NULL and "no phone on file" is the empty string, so a blanket
      # `UNIQUE (phone, role)` is unsatisfiable against production, where 134 of 231
      # rows are blank. That constraint shipped on 2026-08-10, `prisma migrate deploy`
      # exited 1, and because deploy was chained into the Fly start command with `&&`
      # the API never started — a ~10-day outage over nine green CD runs. The step
      # above ("Apply migrations to test DB") CANNOT catch a recurrence: it runs
      # against a FRESH service container where a total unique constraint applies
      # perfectly cleanly. Only inserting blank-phone rows and watching them be
      # accepted proves the predicate is still there, which is what these do.
      #
      # The .teeth file is in this list on purpose, not by copy-paste. It migrates a
      # throwaway schema, recreates the index TOTAL (and in its btrim-expression
      # variant), and asserts the shared probe module goes red — so if the probes are
      # ever gutted into a green no-op, the gate breaks instead of quietly passing.
      # Together they add ~10s; both are self-cleaning (every probe rolls its
      # transaction back; the scratch schema is dropped in afterAll).
      #
      # Deliberately NO --passWithNoTests: if every pattern below is ever deleted,
      # jest exits 1 on "0 matches" and the gate fails loudly instead of silently
      # passing an empty run. (Note that jest exits 0 when SOME patterns match, so a
      # single stale path here would have degraded this gate silently rather than
      # breaking the build — which is exactly why the stale path is removed rather
      # than left in place.)
      - name: Run admin-spec coverage sweeps + endpoint-coverage gate
        working-directory: backend-api
        run: >-
          npx jest
          tests/integration/admin-uuid-500-sweep.test.ts
          tests/integration/admin-endpoint-coverage.test.ts
          tests/integration/app-route-ownership.test.ts
          tests/integration/spec-corpus-dual-currency-sweep.test.ts
          tests/integration/user-phone-role-partial-unique.test.ts
          tests/integration/user-phone-role-partial-unique.teeth.test.ts
          --runInBand --ci
