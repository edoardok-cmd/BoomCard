# fly.toml app configuration file generated for boomcard-api on 2025-11-19T09:04:49+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'boomcard-api'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3001'
  OCR_MAX_CONCURRENT = '2'
  FRONTEND_URL = 'https://boomcard.bg'

[processes]
  app = "sh -c 'node_modules/.bin/prisma migrate resolve --rolled-back 20260321_simplify_partner_tiers 2>&1 || true && node_modules/.bin/prisma migrate resolve --rolled-back 20260518_audit_pass_v11_followups 2>&1 || true && node_modules/.bin/prisma migrate deploy && node dist/server.js'"
  worker = "node dist/worker.js"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ['app', 'worker']
