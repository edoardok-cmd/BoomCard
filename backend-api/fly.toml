# fly.toml app configuration file generated for boomcard-api on 2025-11-19T09:04:49+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'boomcard-api'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3001'
  OCR_MAX_CONCURRENT = '2'
  FRONTEND_URL = 'https://boomcard.bg'
  # BC-QA-058: liveness port for the `worker` process's health check below.
  # Set explicitly (rather than relying on src/worker.ts's WORKER_PORT
  # default) so this file and the internal_port it declares can never drift
  # out of sync with what the process actually binds.
  WORKER_PORT = '3002'

# BC-QA-051: schema migration is DECOUPLED from process start.
#
# Before this change, `[processes] app` was a single `sh -c` chain ending in
# `... && prisma migrate deploy && node dist/server.js`. A migration failure
# (P3009 — a migration recorded as failed in the production DB) therefore made
# `node dist/server.js` unreachable: every machine exited 1 and Fly crash-looped
# it until it hit the max restart count. A release problem became a TOTAL
# OUTAGE, and because no health checks were defined, `flyctl deploy` still
# reported SUCCESS — every CD run from the start of the outage onward was
# green, and `flyctl releases` recorded v296..v306 all `complete`, for ~10
# days. (See .github/workflows/deploy-fly.yml for the query that reproduces
# the run list; do not hand-maintain a count here.)
#
# `release_command` is Fly's intended mechanism for this. It runs ONCE, in a
# temporary machine using this app's env + secrets, BEFORE any new machine
# takes traffic. If it exits non-zero the deploy ABORTS: no new machines are
# created or updated, and the PREVIOUS release keeps serving. A migration
# problem is now a failed release, not an outage.
[deploy]
  # 1. `node prisma/auto-baseline.js` (BC-QA-022 follow-up) auto-baselines an
  #    existing, un-baselined, pre-squash-history database against `0_init`
  #    before `prisma migrate deploy` would otherwise fail with P3018. Kept:
  #    it is idempotent, a no-op on an already-baselined DB, and by its own
  #    design it never fails the chain itself (it exits 0 on any unexpected
  #    error and lets migrate deploy surface the real error). See
  #    backend-api/prisma/auto-baseline.js header comment for full detail.
  # 2. `prisma migrate deploy` applies pending migrations. If it fails, the
  #    release fails and the deploy aborts — which is the entire point.
  #
  # DROPPED from the old chain (BC-QA-051): the two legacy
  # `prisma migrate resolve --rolled-back <name> || true` calls for
  # `20260321_simplify_partner_tiers` and `20260518_audit_pass_v11_followups`.
  # Neither migration exists under prisma/migrations any more (both were
  # squashed into `0_init`), and production logs show the first one emitting
  # `Error: P3012 ... cannot be rolled back because it is not in a failed
  # state` on EVERY boot. They were `|| true`-swallowed no-ops contributing
  # nothing but noise, and the `|| true` is exactly the pattern that hides a
  # real failure. A genuinely stuck `0_init` row is already handled by
  # auto-baseline.js step 2.
  #
  # PUBLIC-LOG INVARIANT (BC-QA-051 review F1): this command's output is
  # printed inline by `flyctl deploy` when it fails, and the CD workflow that
  # runs it lives in a PUBLIC repository, so that output is published to a
  # world-readable Actions log retained for 90 days. The surface is bounded —
  # only the two commands below run here, never the application — but any
  # MIGRATION that prints row data publishes it. Migrations reached from here
  # must report counts/ids, not values.
  release_command = "sh -c 'node prisma/auto-baseline.js && node_modules/.bin/prisma migrate deploy'"

  # Pinned explicitly rather than inherited. Fly's default for this is 5
  # minutes; setting it to the same value changes nothing today but makes the
  # budget visible and stops it moving under us if the platform default
  # changes.
  #
  # Why 5m is right for THIS workload: the release runs auto-baseline (a couple
  # of metadata queries) plus `migrate deploy` over three pending migrations
  # against a 231-row User table. The heaviest statement is a CREATE UNIQUE
  # INDEX on that table — sub-second at this size.
  #
  # The failure mode is deliberately the safe one. A timeout aborts the release
  # exactly like a non-zero exit: no machines are created or updated and the
  # PREVIOUS version keeps serving. So the risk of this value being too LOW is
  # a failed deploy, while the risk of it being too HIGH is a migration holding
  # locks for longer before anyone is told. Given `CREATE UNIQUE INDEX` takes a
  # ShareLock that blocks writers, failing fast is the better default.
  #
  # Raise this deliberately, in the same commit, if a future migration needs a
  # long backfill or a large index build — and prefer doing that work outside
  # the release command entirely.
  release_command_timeout = "5m"

[processes]
  # Just start the server. No migration, no `|| true`, nothing that can turn a
  # schema problem into a crash-loop.
  app = "node dist/server.js"
  worker = "node dist/worker.js"

  # BC-QA-054 found `worker` had NO health check, unlike `app` below — a
  # known, investigated gap, not an oversight — because `worker` opened no
  # listening port (a pure outbound BullMQ consumer) and every Fly mechanism
  # for an ONGOING liveness check is fundamentally port-based. That pass
  # documented the fix it could not make (a minimal liveness listener in
  # src/worker.ts, application code out of an ops-file-only pass's scope)
  # and closed only the missing-required-secret slice via a pre-deploy gate
  # in .github/workflows/deploy-fly.yml.
  #
  # BC-QA-058 makes that fix: src/worker.ts now opens a minimal HTTP
  # liveness listener on WORKER_PORT (env, default 3002) once
  # startMerchantVerificationWorker() has actually succeeded — see the
  # `[[services]]` block below, which is the "easy, well-supported part"
  # BC-QA-054 predicted once a real port existed to check.

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # BC-QA-051: the app previously defined NO health checks at all, so
  # `flyctl deploy` reported success as soon as machines were CREATED, even
  # though the process died immediately afterwards. `flyctl status` showed an
  # empty CHECKS column. This check is the missing signal: it passes iff the
  # HTTP server is actually listening and serving, so a crash-looping release
  # now FAILS the deploy instead of reporting green.
  #
  # Path choice — `/health`, not `/api/health`:
  #   Both are pure liveness handlers (no DB work in the handler). `/api/health`
  #   sits BEHIND the global rate limiters mounted at `app.use('/api/', ...)`
  #   in src/server.ts, which are IP-keyed and return 429 when tripped.
  #   Measured against this build with NODE_ENV=production: 130 sequential
  #   GETs to /api/health returned 98x200 + 32x429, while 130 GETs to /health
  #   returned 130x200. Wiring the machine-level health check through a rate
  #   limiter creates a path where LOAD — not a real fault — can mark healthy
  #   machines unhealthy and take the app down. `/health` (src/server.ts) is
  #   mounted outside `/api/`, so it is not rate limited and not subject to the
  #   CSRF middleware. It is also the path the Dockerfile HEALTHCHECK uses.
  #   The PUBLIC `/api/health` URL is still asserted post-deploy by
  #   .github/workflows/deploy-fly.yml, which covers the edge/proxy/TLS path
  #   and the exact base path boomcard.bg calls. The two checks are
  #   complementary, not redundant.
  [[http_service.checks]]
    path = "/health"
    method = "GET"
    protocol = "http"
    # Boot budget: with migrations moved to release_command, startup is only
    # module load + one `SELECT 1` connectivity probe before httpServer.listen
    # (src/server.ts startServer()). Measured on this build: 0.77s from process
    # spawn to a 200 on /health (0.85s on /api/health). 30s grace is ~39x that,
    # which absorbs a cold shared-cpu-1x machine, a cold Prisma query engine and
    # a TLS handshake to a remote Postgres, while still catching a genuinely
    # dead process quickly. It is deliberately NOT longer: grace_period is dead
    # time added to every deploy and every auto_start wake-up.
    grace_period = "30s"
    # 10s interval: fast enough that a deploy verdict lands promptly and a
    # mid-life crash is caught within ~30s (3 consecutive failures), cheap
    # enough at ~6 req/min/machine to be irrelevant to load.
    interval = "10s"
    # 5s timeout: the handler does no I/O, so anything approaching 5s already
    # means the event loop is blocked or the process is wedged — which is a
    # condition we WANT to fail on, not wait out.
    timeout = "5s"

# BC-QA-058: `worker`'s ongoing liveness check. Unlike `[http_service]` above
# (a single named "primary" service Fly treats specially — Elastic IP,
# force_https, etc.), a non-`app` process needs the general `[[services]]`
# form, scoped with `processes = ['worker']` the same way `[[vm]]` below
# already is.
[[services]]
  internal_port = 3002
  protocol = "tcp"
  processes = ['worker']

  # Deliberately no `[[services.ports]]` block: this service exists only so
  # Fly has an internal port to run the check below against — `worker` has no
  # auth, no CORS, no rate limiting (see src/worker.ts), and must not be
  # reachable from the public internet the way `app`'s :3001 is. `[[services.
  # ports]]` governs external/edge exposure, not whether Fly's own
  # check daemon (which probes internal_port directly over the private 6PN
  # network) can reach this service — so omitting it is expected to leave the
  # check functional while keeping :3002 off the public internet.
  # Verified with `flyctl config validate --strict -c fly.toml` (flyctl
  # v0.3.219, this repo, BC-QA-058): the SAME "Service must expose at least
  # one port ... will hard fail after February 15, 2024" warning BC-QA-054
  # found above is emitted again here — and, since that date has long since
  # passed with this validator still returning "✓ Configuration is valid"
  # rather than an error, that warning is confirmed stale/unenforced by THIS
  # flyctl version rather than merely assumed to be. Full confirmation still
  # requires a real `flyctl deploy`, which remains out of scope here (no Fly
  # credentials in this environment) — if a future deploy ever hard-fails on
  # this warning, the fix is adding a `[[services.ports]]` block with no
  # `handlers` (internal-only), not reverting this check.

  # http, not tcp: a bare TCP check only proves the socket accepts a
  # connection, which for a plain `http.createServer` (src/worker.ts) is true
  # the instant `.listen()` resolves. An HTTP check additionally proves the
  # process completes a full request/response cycle on its event loop, so a
  # worker whose loop is wedged (e.g. hung inside a synchronous OCR call)
  # still fails the check even though the TCP socket would still accept.
  # That's the same reasoning `[http_service.checks]` above already applies
  # to `app`; matching it here keeps semantics identical between the two
  # processes.
  [[services.http_checks]]
    interval = "10s"
    grace_period = "30s"
    method = "get"
    path = "/health"
    protocol = "http"
    timeout = "5s"
    # grace_period: measured on this build, spawn-to-200 on :3002 was ~0.5s
    # (module load + BullMQ/Redis connection, no Postgres round-trip on this
    # path — worker.ts never calls prisma before binding) — even lighter than
    # `app`'s measured 0.77s. Reusing `app`'s 30s grace budget rather than
    # tightening it further: it's the same shared-cpu-1x machine class and
    # cold-Redis-connection variance under real network conditions is
    # unmeasured here, so there's no basis to shave the margin for a value
    # that only adds dead time when a deploy is already failing.
    # interval/timeout: identical reasoning to `[http_service.checks]` above
    # — 10s interval catches a mid-life crash within ~30s (3 consecutive
    # failures) at negligible request cost; 5s timeout fails fast on a
    # wedged event loop rather than waiting it out, since the handler itself
    # does zero I/O.

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ['app', 'worker']
